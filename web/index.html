<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twinmark 判定报告</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #1c2333; background: #f5f6f8; }
  header { padding: 16px 24px 8px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #stats { display: flex; flex-wrap: wrap; gap: 8px; }
  #stats .stat { background: #fff; border: 1px solid #e2e5ec; border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  #stats .stat b { display: block; font-size: 18px; }
  main { display: flex; gap: 16px; padding: 12px 24px 24px; align-items: flex-start; }
  #list-panel { width: 320px; flex: none; background: #fff; border: 1px solid #e2e5ec; border-radius: 8px; max-height: 75vh; overflow: auto; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { padding: 8px 12px; border-bottom: 1px solid #eef0f4; cursor: pointer; font-size: 13px; }
  #list li:hover { background: #f0f5ff; }
  #list li.active { background: #e3ecff; }
  #list .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; font-size: 11px; background: #ffe1e1; color: #b3261e; }
  #detail { flex: 1; background: #fff; border: 1px solid #e2e5ec; border-radius: 8px; padding: 16px; min-height: 200px; }
  #detail h2 { font-size: 15px; margin: 0 0 10px; }
  #detail .empty { color: #8a93a6; font-size: 13px; }
  .raw { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 18px; padding: 10px 12px; background: #f8f9fc; border-radius: 6px; margin: 6px 0 14px; word-break: break-all; }
  .raw .side-label { display: block; font-size: 11px; color: #8a93a6; font-family: inherit; margin-bottom: 4px; }
  mark { background: #ffd54d; border-radius: 3px; padding: 0 1px; }
  mark.invisible { background: #ff9e9e; min-width: 10px; display: inline-block; }
  table.pairs { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.pairs th, table.pairs td { border: 1px solid #e2e5ec; padding: 4px 8px; text-align: left; }
  table.pairs th { background: #f0f2f7; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>twinmark 判定报告</h1>
  <div id="stats"></div>
</header>
<main>
  <section id="list-panel"><ul id="list"></ul></section>
  <section id="detail"><p class="empty">加载中…</p></section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
